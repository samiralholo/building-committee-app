name: Supabase keep-alive

# Free-tier Supabase projects pause after 7 days without activity.
# This pings the database every 4 days with a tiny read-only query.
on:
  schedule:
    - cron: '17 6 */4 * *' # 06:17 UTC on days 1, 5, 9, … of every month (max gap: 4 days)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: public-config.json
          sparse-checkout-cone-mode: false
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Repo secrets win; otherwise use the committed browser-safe public-config.json
          if [ -z "$SUPABASE_URL" ]; then SUPABASE_URL=$(jq -r .supabaseUrl public-config.json); fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then SUPABASE_ANON_KEY=$(jq -r .supabasePublishableKey public-config.json); fi
          if [ -z "$SUPABASE_URL" ] || [ "$SUPABASE_URL" = "null" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ "$SUPABASE_ANON_KEY" = "null" ]; then
            echo "::error::Set SUPABASE_URL / SUPABASE_ANON_KEY secrets or fill public-config.json"
            exit 1
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/keepalive_ping" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $status"; cat response.json; echo
          test "$status" = "200"
