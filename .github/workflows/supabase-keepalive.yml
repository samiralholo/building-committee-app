name: Supabase keep-alive

# Free-tier Supabase projects pause after 7 days without activity.
# This pings the database every 4 days with a tiny read-only query.
on:
  schedule:
    - cron: '17 6 */4 * *' # 06:17 UTC on days 1, 5, 9, … of every month (max gap: 4 days)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_ANON_KEY in Settings → Secrets and variables → Actions"
            exit 1
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/keepalive_ping" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $status"; cat response.json; echo
          test "$status" = "200"
